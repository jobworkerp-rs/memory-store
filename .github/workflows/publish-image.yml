# Maintained in the private source repository and published here by its
# release sync together with the rest of .github/; edit it there, not here.
name: Publish Image

# Triggered on the public GitHub repository when a release tag is pushed
# (the release sync of the private source mirrors the tree and pushes the
# tag here). Runs the full test suite (SQLite + PostgreSQL) as a gate, then
# builds the memories gRPC server image from Dockerfile and publishes it to
# GitHub Container Registry (ghcr.io).
#
# This is the primary place tests run for the public repository: the
# PR-triggered ci.yaml only fires on external pull requests, so the normal
# tag-sync flow relies on the jobs here. The image is published only if both
# test jobs pass, and their results are visible on the Actions run for the
# release tag — so consumers can see each published image was built from a
# tested commit. Tests run exactly once here (ci.yaml does not fire on tag
# pushes), so there is no duplicate run or flaky double-gating.
#
# No build cache: GitHub scopes caches to the ref, and a tag-only workflow
# can never restore what a previous tag saved.
#
# Jobs run directly on the runner host (no `container:`), so service
# containers are reachable only via 127.0.0.1 + a mapped port, not by the
# service name — hence the explicit `ports:` and 127.0.0.1 TEST_* URLs.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-sqlite:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Remove large packages
        run: |
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev protobuf-compiler
      - name: Clean up apt cache
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run test (SQLite)
        run: CARGO_BUILD_JOBS=1 cargo test -- --test-threads=1
        env:
          TEST_REDIS_URL: "redis://127.0.0.1:6379"
          RUST_BACKTRACE: 1

  test-postgres:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Remove large packages
        run: |
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev protobuf-compiler
      - name: Clean up apt cache
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run test (PostgreSQL)
        run: CARGO_BUILD_JOBS=1 cargo test --features postgres -- --test-threads=1
        env:
          TEST_POSTGRES_URL: "postgres://postgres:postgres@127.0.0.1:5432/test"
          TEST_REDIS_URL: "redis://127.0.0.1:6379"
          RUST_BACKTRACE: 1

  build-and-publish:
    needs: [test-sqlite, test-postgres]
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          platforms: linux/amd64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push memories Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Record immutable image reference
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          printf '%s\n' "$image" | tee memories-image-reference.txt
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016 # the backticks are Markdown
          printf '## Published immutable image\n\n`%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable image reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memories-image-reference-${{ github.ref_name }}
          path: memories-image-reference.txt
          if-no-files-found: error
